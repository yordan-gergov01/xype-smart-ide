# CI parity with local hooks. Later Phase 1 slices add compose and integration jobs.
# Actions are pinned to commit SHAs (public repo, supply-chain safety).
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Size limits
        run: python tools/check_size.py
      - name: Paid API guard (no paid endpoints outside allowed files)
        run: python tools/check_paid_api.py
      - name: Repo check script tests
        run: python -m unittest tools/test_repo_checks.py
      - name: Conventional commits (PR range)
        if: github.event_name == 'pull_request'
        run: python tools/check_commit_msg.py --range "origin/${{ github.base_ref }}..HEAD"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned, hash-checked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install -e . --no-deps
      - name: Requirements are compiled from the .in files
        run: |
          uv pip compile --universal --generate-hashes --python-version 3.12 --quiet requirements/dev.in -o requirements/dev.txt
          git diff --exit-code -- requirements/
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: lint-imports
      - run: pytest --cov --cov-report=term

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Contract changes must not break clients built from master (buf FILE rules).
      # Skipped until master has the proto module.
      - name: buf breaking against master
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/${BASE_REF}:proto/buf.yaml" 2>/dev/null; then
            npx --no-install buf breaking proto --against ".git#ref=origin/${BASE_REF},subdir=proto"
          else
            echo "No proto module on ${BASE_REF} yet; nothing to compare."
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
