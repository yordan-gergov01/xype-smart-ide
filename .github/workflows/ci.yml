# CI parity with local hooks, plus integration tests, a dependency scan and an SBOM (ADR-0012).
# Actions are pinned to commit SHAs (public repo, supply-chain safety).
name: ci

on:
  pull_request:
  push:
    branches: [master]

# Read-only token, and checkouts never keep it in .git/config (no job pushes).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Size limits
        run: python tools/check_size.py
      - name: Paid API guard (no paid endpoints outside allowed files)
        run: python tools/check_paid_api.py
      - name: No paid provider enabled in tracked configuration
        run: python tools/check_paid_config.py
      - name: Repo check script tests
        run: python -m unittest tools/test_repo_checks.py
      - name: Conventional commits (PR range)
        if: github.event_name == 'pull_request'
        run: python tools/check_commit_msg.py --range "origin/${{ github.base_ref }}..HEAD"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned, hash-checked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install -e . --no-deps
      - name: Requirements are compiled from the .in files
        run: |
          for name in backend dev; do
            uv pip compile --universal --generate-hashes --python-version 3.12 --quiet "requirements/${name}.in" -o "requirements/${name}.txt"
          done
          git diff --exit-code -- requirements/
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: lint-imports
      # The network guard (tests/support/network_guard.py) refuses every host but this one.
      - run: pytest --cov --cov-report=term

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned, hash-checked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install -e . --no-deps
      # Testcontainers (Postgres + pgvector and the backend probes). The embedder test needs
      # the local model volume from compose and runs on developer machines only (`models`).
      - run: pytest -m "integration and not models"

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Contract changes must not break clients built from master (buf FILE rules).
      # Skipped until master has the proto module.
      - name: buf breaking against master
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/${BASE_REF}:proto/buf.yaml" 2>/dev/null; then
            npx --no-install buf breaking proto --against ".git#ref=origin/${BASE_REF},subdir=proto"
          else
            echo "No proto module on ${BASE_REF} yet; nothing to compare."
          fi

  # Known vulnerabilities in the locked dependencies; accepted ones live in osv-scanner.toml
  # with a reason and an expiry. The action is pinned by SHA, its image by tag.
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            source
            --config=osv-scanner.toml
            --lockfile=requirements.txt:server/requirements/backend.txt
            --lockfile=requirements.txt:server/requirements/dev.txt
            --lockfile=package-lock.json

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CycloneDX of the locked dependencies, kept as a build artifact. No dependency
      # snapshot or release upload, so the job keeps read-only permissions.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          dependency-snapshot: false
          upload-release-assets: false

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
