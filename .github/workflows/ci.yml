# CI parity with local hooks. Later Phase 1 slices add Python, TS, proto and compose jobs.
# Actions are pinned to commit SHAs (public repo, supply-chain safety).
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Size limits
        run: python tools/check_size.py
      - name: Paid API guard (no paid endpoints outside allowed files)
        run: python tools/check_paid_api.py
      - name: Repo check script tests
        run: python -m unittest tools/test_repo_checks.py
      - name: Claude hook tests
        run: node --test .claude/hooks/hooks.test.mjs
      - name: Conventional commits (PR range)
        if: github.event_name == 'pull_request'
        run: python tools/check_commit_msg.py --range "origin/${{ github.base_ref }}..HEAD"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
