// XYPE IDE gRPC contract, package xype.v1 (buf v2, STANDARD lint, FILE breaking).
// Indexing and Merkle-tree delta sync.
//
// Privacy: any field that carries code, file paths, queries or answers is an
// EncryptedPayload. Plaintext fields carry only ids, hashes, sizes and enums.

syntax = "proto3";

package xype.v1;

import "xype/v1/common.proto";

// Client reports its root after a debounced change (ADR-0018); the server descends if
// it differs from its own.
message MerkleRootReport {
  string repository_id = 1;
  string root_hash = 2; // 64-char lowercase hex, the client's root (ADR-0018)
}

// Server asks the client for its tree (10-min poll or after a mismatch).
message MerkleSyncRequest {
  string request_id = 1;
  string repository_id = 2;
  string server_root_hash = 3;
  repeated string node_ids = 4; // obfuscated (HMAC) node ids to descend; empty = root
}

message MerkleTreeReport {
  string request_id = 1;
  string repository_id = 2;
  string root_hash = 3; // the client's root; checked against the reported top level
  repeated MerkleNode nodes = 4; // children of requested nodes
  // A request's children may span several reports (at most 2 000 nodes each, same
  // request_id); the last one sets this. Unset means more follow, so a forgotten field
  // never ends a level early (nothing is compared or deleted before it).
  bool last_page = 5;
}

message MerkleNode {
  string node_id = 1; // hmac_id of a dir or file path, or of a chunk position (ADR-0018)
  string hash = 2; // HMAC of the chunk (leaf) or hash over the children's HMACs
  bool is_leaf = 3; // leaf = chunk
  LineRange lines = 4; // for leaves
  string parent_id = 5; // node id of the requested node this child belongs to
}

// Server tells the client which leaves changed and must be uploaded.
message MerkleDelta {
  string request_id = 1;
  string repository_id = 2;
  repeated ChunkRef upload = 3;
  repeated string deleted_node_ids = 4;
}

// Client uploads changed chunks (initial index and deltas).
message ChunkUpload {
  string request_id = 1;
  string repository_id = 2;
  repeated ChunkContent chunks = 3;
  string new_root_hash = 4;
  bool is_initial = 5;
}

message IndexAck {
  string request_id = 1;
  repeated string indexed_chunk_ids = 2;
  string server_root_hash = 3;
  // Chunks the server did not embed. They count as settled, so the next sync does not
  // upload them again (ADR-0018, ADR-0019).
  repeated RejectedChunk rejected = 4;
}

message RejectedChunk {
  ChunkRef chunk = 1;
  RejectionReason reason = 2;
}

// Fixed reasons only: never a detail of what was found.
enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_SECRET_FOUND = 1; // the server's scrub re-check matched (ADR-0019)
  REJECTION_REASON_TOO_LARGE = 2; // over 64 KiB after decryption
}
