// XYPE IDE — gRPC contract DRAFT (Phase 0).
// Moves to proto/xype/v1/ in Phase 1 (ADR-0006) and is split per concern
// (session.proto, completion.proto, chat.proto, agent.proto, index.proto, common.proto).
// Lint target: buf v2, STANDARD lint, FILE breaking.
//
// Transport: one persistent bidirectional stream per IDE window (brief §3.3, §3.5).
// Auth: access token in the `authorization` metadata header of the stream call;
// token refresh happens over REST (/api/v1/auth/refresh) and is announced in-band.
// Privacy: any field that carries code, file paths, queries or answers is an
// EncryptedPayload. Plaintext proto fields carry only IDs, hashes, sizes and enums.

syntax = "proto3";

package xype.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------- service

service SessionService {
  // Persistent bidi stream. Client sends Hello first; server answers HelloAck.
  // SessionRequest = client→server envelope, SessionResponse = server→client
  // (names follow buf STANDARD RPC_REQUEST/RESPONSE_STANDARD_NAME).
  rpc Session(stream SessionRequest) returns (stream SessionResponse);
}

// ---------------------------------------------------------------- envelopes

message SessionRequest {
  Envelope envelope = 1;
  oneof body {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    CompletionRequest completion_request = 20;
    CancelRequest cancel = 21;
    ChatQuery chat_query = 30;
    AgentExecute agent_execute = 40;
    ChunkResponse chunk_response = 50;
    ToolResult tool_result = 60;
    MerkleTreeReport merkle_tree_report = 70;
    ChunkUpload chunk_upload = 71;
    Feedback feedback = 80;
  }
}

message SessionResponse {
  Envelope envelope = 1;
  oneof body {
    HelloAck hello_ack = 10;
    Heartbeat heartbeat = 11;
    TokenRefreshRequired token_refresh_required = 12;
    CompletionResponse completion_response = 20;
    ChatDelta chat_delta = 30;
    ChatDone chat_done = 31;
    ChunkRequest chunk_request = 50;
    ToolExecRequest tool_exec_request = 60;
    TaskProgress task_progress = 61;
    TaskCompleted task_completed = 62;
    MerkleSyncRequest merkle_sync_request = 70;
    MerkleDelta merkle_delta = 71;
    IndexAck index_ack = 72;
    StreamError error = 90;
  }
}

// Correlation for every message, propagated to logs/traces/RabbitMQ headers.
message Envelope {
  string message_id = 1;      // UUIDv7, unique per message
  string correlation_id = 2;  // request_id this message answers or belongs to
  string trace_parent = 3;    // W3C traceparent
  google.protobuf.Timestamp sent_at = 4;
}

// ---------------------------------------------------------------- common

// AES-256-GCM ciphertext produced on the client with a per-session key.
// The server decrypts only in memory (brief §3.7).
message EncryptedPayload {
  string key_id = 1;      // session key id; rotation-aware
  bytes nonce = 2;        // 12 bytes, unique per (key, message)
  bytes ciphertext = 3;   // includes the 16-byte GCM tag
  bytes aad = 4;          // authenticated, unencrypted header bytes (ids, sizes)
}

// Obfuscated reference to a code region. No file names or symbols in clear.
message ChunkRef {
  string repository_id = 1;        // server-side UUID of a registered repo
  string obfuscated_file_id = 2;   // HMAC-SHA256(repo_key, normalized_path), hex
  LineRange lines = 3;
  string chunk_hash = 4;           // HMAC of chunk content; Merkle leaf
}

message LineRange {
  uint32 start = 1;  // 1-based, inclusive
  uint32 end = 2;    // inclusive
}

enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_COMPLETION = 1;
  TASK_TYPE_CHAT = 2;
  TASK_TYPE_REFACTOR = 3;
  TASK_TYPE_TESTS = 4;
  TASK_TYPE_DOCS = 5;
  TASK_TYPE_LINT = 6;
  TASK_TYPE_IMPLEMENT_TICKET = 7;
}

// Which model actually answered; shown in the UI (brief §6 cost indicators).
message ModelInfo {
  string model_id = 1;
  string model_version = 2;
  bool is_backup = 3;        // true when race-to-response or fallback served it
  string reason = 4;         // e.g. "primary_timeout", "budget_degrade"
}

message Usage {
  uint32 input_tokens = 1;
  uint32 input_cached_tokens = 2;
  uint32 output_tokens = 3;
  int64 cost_micro_usd = 4;  // USD; 0 for local and mock models
  bool cache_hit = 5;        // served from our own cache (no model call)
}

// ---------------------------------------------------------------- session

message Hello {
  string client_version = 1;     // SemVer of xype-ai
  string workspace_id = 2;       // client-generated, stable per workspace
  repeated string repository_ids = 3;
  string session_key_id = 4;     // key negotiated via REST /api/v1/auth/session-key
  uint32 max_parallel_tools = 5;
}

message HelloAck {
  string session_id = 1;
  uint32 heartbeat_interval_s = 2;
  uint32 rate_limit_per_minute = 3;
  repeated string enabled_features = 4;  // e.g. "chat", "agents", "web_disabled"
}

message Heartbeat {
  uint64 seq = 1;
}

message TokenRefreshRequired {
  google.protobuf.Timestamp expires_at = 1;
}

message CancelRequest {
  string target_request_id = 1;  // completion, chat or agent task id
}

message StreamError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_UNAUTHENTICATED = 1;
    CODE_RATE_LIMITED = 2;
    CODE_INVALID_REQUEST = 3;
    CODE_BUDGET_EXCEEDED = 4;
    CODE_MODEL_UNAVAILABLE = 5;
    CODE_TIMEOUT = 6;
    CODE_INTERNAL = 7;
  }
  Code code = 1;
  string message = 2;           // safe, no request content
  uint32 retry_after_ms = 3;
}

// ---------------------------------------------------------------- completion (sync path)

message CompletionRequest {
  string request_id = 1;
  string repository_id = 2;
  string obfuscated_file_id = 3;
  string language_id = 4;          // e.g. "python", "typescriptreact"
  // Encrypted CompletionContext (below), serialized then encrypted.
  EncryptedPayload context = 5;
  uint32 max_tokens = 6;
  string snippet_hash = 7;         // for the boilerplate cache key (brief §3.8)
}

// Plaintext form, only ever inside EncryptedPayload.
message CompletionContext {
  string prefix = 1;               // code before cursor (scrubbed)
  string suffix = 2;               // code after cursor (scrubbed)
  repeated string related_snippets = 3;   // call-graph dependents, open tabs
  repeated string recent_commit_summaries = 4;  // file git history
  map<string, string> user_preferences = 5;
}

message CompletionResponse {
  string request_id = 1;
  EncryptedPayload completion = 2;   // encrypted text to insert
  ModelInfo model = 3;
  Usage usage = 4;
  uint32 server_latency_ms = 5;
}

// ---------------------------------------------------------------- chat (async path)

message ChatQuery {
  string request_id = 1;
  string chat_session_id = 2;      // empty → new session
  oneof scope {
    FileScope files = 3;
    FullCodebaseScope full_codebase = 4;
    WebScope web = 5;               // interface only; disabled in v1
  }
  EncryptedPayload query = 6;       // encrypted user question (scrubbed)
  string preferred_model_id = 7;
  bool want_alternatives = 8;       // multi-model answers for ambiguous requests
  string idempotency_key = 9;       // required; chat is queued (brief §2 reliability)
}

message FileScope {
  repeated ChunkRef chunks = 1;     // selected files/regions
}

message FullCodebaseScope {
  repeated string repository_ids = 1;
  bool include_templates = 2;       // templates are always eligible (brief §4.1)
}

message WebScope {}

message ChatDelta {
  string request_id = 1;
  uint32 seq = 2;                   // strict order of deltas
  EncryptedPayload text = 3;
  uint32 alternative_index = 4;     // 0 = main answer
}

message ChatDone {
  string request_id = 1;
  string chat_session_id = 2;
  string message_id = 3;            // persisted chat_messages row
  ModelInfo model = 4;
  Usage usage = 5;
  repeated ChunkRef citations = 6;
  repeated string anomaly_flags = 7;
}

// ---------------------------------------------------------------- server → client fetch

// Server asks for exact chunk content after vector search (brief §3.5).
message ChunkRequest {
  string request_id = 1;            // id of the fetch; answers reuse it
  string purpose_request_id = 2;    // chat/agent request this fetch serves
  repeated ChunkRef chunks = 3;
  uint32 max_bytes = 4;             // minimized transfer
}

message ChunkResponse {
  string request_id = 1;
  repeated ChunkContent chunks = 2;
  repeated ChunkRef missing = 3;    // stale or deleted on the client
}

message ChunkContent {
  ChunkRef ref = 1;
  EncryptedPayload content = 2;     // scrubbed code
}

// ---------------------------------------------------------------- agents

message AgentExecute {
  string request_id = 1;
  string idempotency_key = 2;       // required; dedupes resubmits
  TaskType task_type = 3;
  repeated string repository_ids = 4;
  EncryptedPayload instruction = 5;
  string jira_issue_key = 6;        // optional, e.g. "XYPE-123"
  bool run_now = 7;                 // overrides CostScheduler deferral
}

message ToolExecRequest {
  string request_id = 1;            // tool call id
  string task_id = 2;
  enum Tool {
    TOOL_UNSPECIFIED = 0;
    TOOL_READ_FILE = 1;
    TOOL_SEARCH = 2;
    TOOL_PROPOSE_EDIT = 3;          // multi-file diff, accept/reject in UI
    TOOL_RUN_TESTS = 4;
    TOOL_RUN_COMMAND = 5;
    TOOL_LIST_FILES = 6;
  }
  Tool tool = 3;
  EncryptedPayload arguments = 4;   // JSON args, encrypted
  bool requires_approval = 5;       // server hint; client rules are authoritative
  uint32 timeout_ms = 6;
}

message ToolResult {
  string request_id = 1;
  string task_id = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_ERROR = 2;
    STATUS_DENIED_BY_USER = 3;
    STATUS_TIMEOUT = 4;
  }
  Status status = 3;
  EncryptedPayload output = 4;      // scrubbed output, encrypted
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_QUEUED = 1;
  TASK_STATUS_STARTED = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_FINISHED = 4;
  TASK_STATUS_FAILED = 5;
  TASK_STATUS_CANCELLED = 6;
  TASK_STATUS_DEFERRED = 7;           // waiting for off-peak window
  TASK_STATUS_WAITING_FOR_CLIENT = 8; // client offline or approval pending
}

message TaskProgress {
  string task_id = 1;
  TaskStatus status = 2;
  uint32 step = 3;
  uint32 total_steps_estimate = 4;
  string step_label = 5;            // generic label, no code ("running tests")
  google.protobuf.Timestamp scheduled_for = 6;  // set when DEFERRED
}

message TaskCompleted {
  string task_id = 1;
  TaskStatus status = 2;            // FINISHED, FAILED or CANCELLED
  EncryptedPayload summary = 3;
  ModelInfo model = 4;
  Usage usage = 5;
}

// ---------------------------------------------------------------- indexing / Merkle sync

// Server asks the client for its tree (10-min poll or after a mismatch).
message MerkleSyncRequest {
  string request_id = 1;
  string repository_id = 2;
  string server_root_hash = 3;
  repeated string node_paths = 4;   // obfuscated node ids to descend; empty = root
}

message MerkleTreeReport {
  string request_id = 1;
  string repository_id = 2;
  string root_hash = 3;
  repeated MerkleNode nodes = 4;    // children of requested nodes
}

message MerkleNode {
  string node_id = 1;               // obfuscated (HMAC of path)
  string hash = 2;
  bool is_leaf = 3;                 // leaf = chunk
  LineRange lines = 4;              // for leaves
}

// Server tells the client which leaves changed and must be uploaded.
message MerkleDelta {
  string request_id = 1;
  string repository_id = 2;
  repeated ChunkRef upload = 3;
  repeated string deleted_node_ids = 4;
}

// Client uploads changed chunks (initial index and deltas).
message ChunkUpload {
  string request_id = 1;
  string repository_id = 2;
  repeated ChunkContent chunks = 3;
  string new_root_hash = 4;
  bool is_initial = 5;
}

message IndexAck {
  string request_id = 1;
  repeated string indexed_chunk_ids = 2;
  string server_root_hash = 3;
}

// ---------------------------------------------------------------- feedback

message Feedback {
  string target_message_id = 1;     // chat message or completion request id
  enum Rating {
    RATING_UNSPECIFIED = 0;
    RATING_UP = 1;
    RATING_DOWN = 2;
  }
  Rating rating = 2;
  EncryptedPayload annotation = 3;
}

// ---------------------------------------------------------------- REST fallback shapes
// REST (FastAPI, /api/v1) reuses these messages as JSON (proto3 JSON mapping):
//   POST /api/v1/auth/token            {client_id, client_secret} → {access_token, refresh_token, expires_in}
//   POST /api/v1/auth/refresh          {refresh_token} → same as above
//   POST /api/v1/auth/session-key      {client_public_key} → {key_id, wrapped_key}  (ECDH, ADR-0015)
//   POST /api/v1/codebases/{id}/upload ChunkUpload → IndexAck
//   GET  /api/v1/codebases/{id}/merkle-tree → MerkleTreeReport (server view)
//   POST /api/v1/complete/code         CompletionRequest → CompletionResponse
//   POST /api/v1/chat/query            ChatQuery → 202 {request_id}; result via stream or GET
//   POST /api/v1/agent/execute         AgentExecute (Idempotency-Key header) → 202 {task_id}
//   GET  /api/v1/agent/tasks/{id}      → TaskProgress
//   POST /api/v1/feedback              Feedback → 204
//   GET  /healthz, /readyz, /metrics
