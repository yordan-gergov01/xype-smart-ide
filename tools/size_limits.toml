# Single source of truth for source-size limits and their exemptions.
# Read by tools/check_size.py (pre-commit, CI) and .claude/hooks/post-edit-check.mjs.
# Glob syntax: `**/` = any number of directories, `*` = any chars except `/`, `?` = one char.

max_file_lines = 500
max_function_lines = 50

# File extensions that count as source code.
source_extensions = [".py", ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".proto", ".sql", ".sh"]

# Explicit exemptions (lockfiles, generated code, upstream sources). Add a reason per entry.
exempt = [
  "**/pnpm-lock.yaml",          # lockfile
  "**/uv.lock",                 # lockfile
  "**/*_pb2.py",                # generated protobuf stubs
  "**/*_pb2_grpc.py",           # generated protobuf stubs
  "**/gen/**",                  # generated code
  "server/storage/migrations/versions/**",  # Alembic autogenerated revisions (reviewed by hand)
  "fork/vscode/**",             # upstream Code-OSS sources
  "docs/drafts/**",             # Phase 0 drafts, removed in Phase 1 slice 5
]
