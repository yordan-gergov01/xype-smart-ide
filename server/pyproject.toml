[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "xype-server"
version = "0.0.0"
description = "XYPE IDE server: backend API, workers and the shared library."
requires-python = ">=3.12,<3.13"
# Dependencies are pinned per service in requirements/*.txt, not declared here (ADR-0007).
dependencies = []

[tool.setuptools.packages.find]
include = ["common_lib*", "backend*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "N",     # naming
    "UP",    # modern syntax for the target version
    "B",     # likely bugs
    "A",     # shadowing builtins and stdlib modules
    "S",     # security
    "ASYNC", # blocking calls in async code
    "BLE",   # blind except
    "C4",    # comprehensions
    "C90",   # cyclomatic complexity
    "SIM",   # simplifications
    "RET",   # return statements
    "PTH",   # pathlib over os.path
    "PT",    # pytest style
    "T20",   # stray print calls
    "TC",    # imports only needed for typing
    "PL",    # pylint subset
    "RUF",   # ruff-specific rules
]
ignore = [
    "PLR2004", # small literal constants read better inline
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is how pytest checks results
    "S105", # tests use deliberately fake secrets
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["common_lib", "backend"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["common_lib", "backend", "tests"]
# Test folders have no __init__.py; name modules by their path so equally named
# test files in different folders do not clash.
explicit_package_bases = true
mypy_path = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes tests/support importable as `support` from every test module.
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not integration and not e2e",
]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real infrastructure (testcontainers)",
    "e2e: end to end across the extension and the server",
]

[tool.coverage.run]
branch = true
source = ["common_lib", "backend"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

# Contracts are added once the modules they name exist; a contract naming a
# missing module fails.
[tool.importlinter]
root_packages = ["common_lib", "backend"]
# Needed so contracts can forbid third-party packages.
include_external_packages = true

# Everything every service imports stays free of web, transport, broker, cache, HTTP
# client and database code. common_lib.models (SQLAlchemy) joins later as the only ORM user.
[[tool.importlinter.contracts]]
name = "The shared library imports no web, transport, broker, cache, HTTP or database code"
type = "forbidden"
source_modules = ["common_lib"]
forbidden_modules = [
    "backend", "fastapi", "starlette", "grpc", "aio_pika", "redis", "httpx", "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Backend layers depend downwards only: api -> services -> dal"
type = "layers"
layers = ["backend.api", "backend.services", "backend.dal"]

# The API reaches the stores only through services; it never imports data access,
# the ORM, the cache or broker clients.
[[tool.importlinter.contracts]]
name = "The API layer never touches stores or the broker directly"
type = "forbidden"
source_modules = ["backend.api"]
forbidden_modules = ["backend.dal", "backend.messaging", "sqlalchemy", "redis", "aio_pika"]
allow_indirect_imports = true

# Business rules see stores, the broker and transports only through Protocols.
[[tool.importlinter.contracts]]
name = "Services never import transports, stores or the broker"
type = "forbidden"
source_modules = ["backend.services"]
forbidden_modules = [
    "backend.api", "backend.messaging", "backend.core",
    "fastapi", "starlette", "grpc", "sqlalchemy", "redis", "aio_pika",
]

[[tool.importlinter.contracts]]
name = "Messaging never imports the API"
type = "forbidden"
source_modules = ["backend.messaging"]
forbidden_modules = ["backend.api", "fastapi", "starlette"]
