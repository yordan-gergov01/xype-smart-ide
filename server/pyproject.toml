[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "xype-server"
version = "0.0.0"
description = "XYPE IDE server: backend API, workers and the shared library."
requires-python = ">=3.12,<3.13"
# Dependencies are pinned per service in requirements/*.txt, not declared here (ADR-0007).
dependencies = []

[tool.setuptools.packages.find]
include = ["common_lib*", "backend*", "llm*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "N",     # naming
    "UP",    # modern syntax for the target version
    "B",     # likely bugs
    "A",     # shadowing builtins and stdlib modules
    "S",     # security
    "ASYNC", # blocking calls in async code
    "BLE",   # blind except
    "C4",    # comprehensions
    "C90",   # cyclomatic complexity
    "SIM",   # simplifications
    "RET",   # return statements
    "PTH",   # pathlib over os.path
    "PT",    # pytest style
    "T20",   # stray print calls
    "TC",    # imports only needed for typing
    "PL",    # pylint subset
    "RUF",   # ruff-specific rules
]
ignore = [
    "PLR2004", # small literal constants read better inline
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 40

[tool.ruff.lint.per-file-ignores]
# Generated by `alembic revision --autogenerate` and reviewed by hand; constraint
# SQL is copied verbatim from the models.
"migrations/versions/*.py" = ["E501"]
"tests/**" = [
    "S101", # assert is how pytest checks results
    "S105", # tests use deliberately fake secrets
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["common_lib", "backend", "llm", "devtools"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["common_lib", "backend", "llm", "devtools", "migrations", "tests"]
# Test folders have no __init__.py; name modules by their path so equally named
# test files in different folders do not clash.
explicit_package_bases = true
mypy_path = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes tests/support importable as `support`, and devtools (not installed) importable.
pythonpath = [".", "tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not integration and not e2e",
]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real infrastructure (testcontainers)",
    "models: needs the local model volume from compose (not in CI)",
    "e2e: end to end across the extension and the server",
]

[tool.coverage.run]
branch = true
source = ["common_lib", "backend", "llm", "devtools"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
# Protocol method bodies and type-checking-only imports never run.
exclude_also = ['^\s*\.\.\.$', 'if TYPE_CHECKING:']

# Contracts are added once the modules they name exist; a contract naming a
# missing module fails.
[tool.importlinter]
root_packages = ["common_lib", "backend", "llm", "devtools"]
# Needed so contracts can forbid third-party packages.
include_external_packages = true

# Everything every service imports stays free of web, transport, broker, cache, HTTP
# client and database code. A new common_lib module is added to this list; only
# common_lib.models uses the ORM (workers never import it).
[[tool.importlinter.contracts]]
name = "The shared library outside models imports no web, transport, broker, cache, HTTP or ORM code"
type = "forbidden"
source_modules = [
    "common_lib.auth", "common_lib.clock", "common_lib.correlation", "common_lib.domain", "common_lib.errors",
    "common_lib.llm", "common_lib.logging_config", "common_lib.secret_bytes", "common_lib.security",
    "common_lib.settings", "common_lib.tls", "common_lib.tracing",
]
forbidden_modules = [
    "backend", "llm", "common_lib.embeddings", "common_lib.keystore", "common_lib.models",
    "fastapi", "starlette", "asyncpg",
    "grpc", "aio_pika", "redis", "httpx", "sqlalchemy", "pgvector",
]

# The key store is shared by the backend (all operations) and the indexer (GET only); it
# talks to the keystore Redis and to nothing else (ADR-0015).
[[tool.importlinter.contracts]]
name = "The key store uses only a Redis client"
type = "forbidden"
source_modules = ["common_lib.keystore"]
forbidden_modules = [
    "backend", "llm", "common_lib.embeddings", "common_lib.models", "fastapi", "starlette",
    "grpc", "aio_pika", "httpx", "sqlalchemy", "asyncpg", "pgvector",
]

# The embedder is shared by the backend (queries) and the indexer (documents); it talks
# to the model server over HTTP and to nothing else.
[[tool.importlinter.contracts]]
name = "Embeddings use only an HTTP client"
type = "forbidden"
source_modules = ["common_lib.embeddings"]
forbidden_modules = [
    "backend", "llm", "common_lib.models", "fastapi", "starlette", "grpc", "aio_pika",
    "redis", "sqlalchemy", "asyncpg", "pgvector",
]

# The dev CA generator is for the local stack only and is never shipped (ADR-0036).
[[tool.importlinter.contracts]]
name = "No service imports the developer tools"
type = "forbidden"
source_modules = ["common_lib", "backend", "llm"]
forbidden_modules = ["devtools"]

[[tool.importlinter.contracts]]
name = "The backend and the LLM worker do not import each other"
type = "independence"
modules = ["backend", "llm"]

[[tool.importlinter.contracts]]
name = "The LLM worker has no database or cache access"
type = "forbidden"
source_modules = ["llm"]
forbidden_modules = [
    "common_lib.models", "sqlalchemy", "asyncpg", "pgvector", "redis", "fastapi", "starlette",
]

[[tool.importlinter.contracts]]
name = "The models know no service, transport, broker or cache"
type = "forbidden"
source_modules = ["common_lib.models"]
forbidden_modules = [
    "backend", "llm", "fastapi", "starlette", "grpc", "aio_pika", "redis", "httpx",
]

[[tool.importlinter.contracts]]
name = "Backend layers depend downwards only: api -> services -> dal"
type = "layers"
layers = ["backend.api", "backend.services", "backend.dal"]

# The API reaches the stores only through services; it never imports data access,
# the ORM, the cache or broker clients.
[[tool.importlinter.contracts]]
name = "The API layer never touches stores or the broker directly"
type = "forbidden"
source_modules = ["backend.api"]
forbidden_modules = [
    "backend.dal", "backend.messaging", "common_lib.models", "sqlalchemy", "redis", "aio_pika",
]
allow_indirect_imports = true

# Business rules see stores, the broker and transports only through Protocols.
[[tool.importlinter.contracts]]
name = "Services never import transports, stores or the broker"
type = "forbidden"
source_modules = ["backend.services"]
forbidden_modules = [
    "backend.api", "backend.messaging", "backend.core", "common_lib.models",
    "fastapi", "starlette", "grpc", "sqlalchemy", "redis", "aio_pika",
]

[[tool.importlinter.contracts]]
name = "Messaging never imports the API"
type = "forbidden"
source_modules = ["backend.messaging"]
forbidden_modules = ["backend.api", "fastapi", "starlette"]
