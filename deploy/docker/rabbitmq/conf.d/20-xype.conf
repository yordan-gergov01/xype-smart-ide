# Broker settings for XYPE IDE, applied after the image's 10-defaults.conf.

# Vhost (quorum queues by default, ADR-0004), users and permissions come from a
# definitions file rendered from the environment at start (entrypoint.sh).
# Importing definitions at boot also stops the default "guest" user from being
# created.
load_definitions = /run/rabbitmq-definitions/definitions.json

# Restore the loopback-only default for "guest" in case it is ever created.
loopback_users.guest = true

# AMQP over TLS only (ADR-0036): no plaintext listener. Clients authenticate with
# passwords, not certificates. The certificates come from the dev CA.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile = /certs/tls.crt
ssl_options.keyfile = /certs/tls.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# The management API can read messages, so it answers inside the container only.
management.tcp.ip = 127.0.0.1
