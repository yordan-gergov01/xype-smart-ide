# Broker settings for XYPE IDE, applied after the image's 10-defaults.conf.

# The vhost (quorum queues by default, ADR-0004) comes from a definitions file.
# Importing definitions at boot also stops the default "guest" user from being
# created. Service users and their permissions are added together with the
# services and the message topology.
load_definitions = /etc/rabbitmq/definitions.json

# Restore the loopback-only default for "guest" in case it is ever created.
loopback_users.guest = true
