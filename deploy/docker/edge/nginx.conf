# Edge proxy for the local stack (ADR-0034): the only service on a network with a
# published port. The backend stays on internal networks only, with no route out.
#
# Privacy: no access log (the backend writes a metadata-only line per request), and
# the error log only at "crit", because nginx error lines repeat the request line
# including its query string.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    client_max_body_size 1m;
    # Bodies stay in memory: plaintext must never be written to disk, tmpfs included.
    client_body_buffer_size 1m;
    proxy_max_temp_file_size 0;

    upstream backend {
        server backend:8000;
        keepalive 8;
    }

    # TLS only, on both hops (ADR-0036): clients reach the edge over TLS with the dev
    # CA's certificate, and the edge verifies the backend's certificate in turn.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tls:1m;
    ssl_session_tickets off;

    # Unauthenticated auth calls per client IP (ADR-0014). The backend sees only this
    # proxy's address, so the per-IP limit lives here; per-user limits are in the backend.
    # 30 a minute leaves room for an office behind one address.
    limit_req_zone $binary_remote_addr zone=auth_per_ip:1m rate=30r/m;
    limit_req_status 429;

    server {
        listen 8443 ssl;
        # HTTP/2 now, for the gRPC session stream (Phase 2 slice 6).
        http2 on;
        ssl_certificate /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;

        proxy_ssl_verify on;
        proxy_ssl_verify_depth 1;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_name backend;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        # Applies to every proxied location below.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Clients do not choose trace ids until they are authenticated.
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # Allow-list: only the public API and liveness leave the stack. /readyz and
        # /metrics are for in-stack probes and Prometheus; every other path is 404.
        location / {
            return 404;
        }

        location = /healthz {
            proxy_pass https://backend;
        }

        location /api/v1/ {
            proxy_pass https://backend;
        }

        location = /api/v1/auth/token {
            limit_req zone=auth_per_ip burst=10 nodelay;
            error_page 429 = @rate_limited;
            proxy_pass https://backend;
        }

        location = /api/v1/auth/refresh {
            limit_req zone=auth_per_ip burst=10 nodelay;
            error_page 429 = @rate_limited;
            proxy_pass https://backend;
        }

        # The same body as the backend's 429 (ADR-0014); one request per 2 s refills.
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 2 always;
            return 429 '{"error":"rate_limited"}';
        }
    }
}
