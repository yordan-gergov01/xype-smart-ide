# Client authentication for the local stack (ADR-0036): over TCP only TLS with a
# password, never plaintext. The socket inside the container (initialisation) also
# needs a password. Passed with `-c hba_file=`, so it applies to an existing data
# volume too.
#
# TYPE    DATABASE  USER  ADDRESS  METHOD
local     all       all            scram-sha-256
hostssl   all       all   all      scram-sha-256
hostnossl all       all   all      reject
