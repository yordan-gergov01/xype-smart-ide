# Prometheus for the local stack (observability profile).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  # The backend serves HTTPS only (ADR-0036); verified against the dev CA.
  - job_name: backend
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/ca.crt
      server_name: backend
    static_configs:
      - targets: ["backend:8000"]
