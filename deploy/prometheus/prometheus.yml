# Prometheus for the local stack (observability profile). The server's /metrics
# endpoints are added with the services (Phase 1 slice 4).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
