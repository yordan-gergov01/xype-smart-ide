# OpenTelemetry collector for the local stack (observability profile).
# Receives OTLP traces from the services. Spans carry ids and sizes only, never
# payloads (.claude/rules/08-observability.md); the debug exporter at "basic"
# verbosity logs one summary line per batch, not span contents. A trace backend
# is chosen with the dashboards in Phase 7.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
